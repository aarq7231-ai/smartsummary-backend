<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartSummary AI</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9706163199050364" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
.top{background:#ffd54f;padding:12px;text-align:center;font-weight:bold}
.wrap{max-width:760px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}
select,input,button{width:100%;padding:12px;margin:10px 0}
#result{background:#eee;padding:15px;min-height:120px}
</style></head><body>
<div class="top">📢 Ad Banner Here</div>
<div class="wrap">
<h2>🤖 SmartSummary AI</h2>
<select id="lang">
<option value="en">English</option>
<option value="ar">العربية</option>
</select>
<input type="file" id="pdf" accept=".pdf">
<button onclick="summarize()">Summarize / تلخيص</button>
<div id="result">Result / النتيجة</div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function summarize(){
const f=document.getElementById('pdf').files[0];
if(!f){alert('Choose a PDF / اختر ملف PDF');return;}
result.innerHTML='Reading...';
const data=await f.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data}).promise;
let text='';
for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const c=await p.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n';}
const lang=document.getElementById('lang').value;
const prompt=(lang==='ar'?'لخص بالعربية:\n':'Summarize in English:\n')+text;
const r=await fetch('https://smartsummary-backend.vercel.app/summarize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:prompt})});
const j=await r.json();
result.textContent=j.summary||'Error';
}
</script></body></html>
