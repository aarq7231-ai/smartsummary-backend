<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="jhfUCwsIhbdIfXYAe1yuU5ih0sObUUsXTkNVOQpzCi8" />
<title>SmartSummary AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9706163199050364"
     crossorigin="anonymous"></script>
<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
direction:rtl;
}

.banner{
background:#ffd54f;
padding:15px;
text-align:center;
font-weight:bold;
}

.container{
width:90%;
max-width:600px;
margin:30px auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#0077ff;
}

input{
width:100%;
padding:12px;
margin:15px 0;
}

button{
width:100%;
padding:15px;
background:#0077ff;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#005fcc;
}

#result{
margin-top:20px;
padding:15px;
background:#eee;
border-radius:10px;
min-height:100px;
}
</style>

</head>

<body>

<div class="banner">
📢 مكان إعلان بانر
</div>

<div class="container">

<h1>🤖 SmartSummary AI</h1>

<input type="file" id="pdf">

<button onclick="summarize()">
تلخيص الملف
</button>

<div id="result">
سيظهر الملخص هنا...
</div>

</div>

<script>

function summarize(){

let file=document.getElementById("pdf").files[0];

if(!file){

alert("اختر ملف أولاً");

return;

}

document.getElementById("result").innerHTML=
"✅ تم رفع الملف بنجاح.<br><br>في المرحلة القادمة سنضيف الذكاء الاصطناعي ليقوم بتلخيصه.";

}

</script>
<script src="script.js"></script>
</body>

</html>
